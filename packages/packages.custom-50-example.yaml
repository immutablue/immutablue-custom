# Packages yaml filename should be in the format of
# packages-custom-<2-numbers>-<description>.yaml 
# - Example: packages-custom-10-my-containers.yaml
# It is **IMPORTANT** to note that these are ran in alphanumeric order.
# (same order that you would get if you did `ls -l ./packages`)
# Meaning, if you are attempting to modify already existing distrobox
# containers for example. Understand the ordering of how they are ran.

# Backends
# Immutablue builds on more than one operating system (a "backend"):
#   fedora-bootc  Fedora Atomic (the default)       make build
#   arch-bootc    Arch Linux                        make ARCHLINUX=1 build
#   freebsd-be    FreeBSD 15.1                      make FREEBSD=1 build
#   gnomeos       GNOME OS (no package manager)
# Each backend reads:
#   - its *native* package lists, in its own package names:
#       rpm*      on fedora-bootc
#       pacman*   on arch-bootc
#       freebsd*  on freebsd-be
#   - the *logical* package lists (pkg*), which name a package once for
#     every backend and override the name only where a backend differs.
# Service lists are shared; an entry can map a systemd unit to its rc(8)
# script name for FreeBSD: {name: sshd.service, rc: sshd}.
#
# The logical lists, the pacman*/freebsd* lists and the {name:, rc:} service
# entries need a base image built from Immutablue's multi-backend design
# (it ships /usr/immutablue/backends). On an older base image built from
# Immutablue master only the rpm* keys, plain service names and the rest of
# this file are read, exactly as before.
#
# Every list is composed the same way: <key>.all, then <key>.<version>
# (e.g. 45, or arch on arch-bootc), then the architecture and build option
# variants (<key>_x86_64, <key>_gui, <key>_silverblue, ...). See
# docs/backends.org.

# Immutablue section, which applies to **YOUR** build of 
# immutablue
immutablue:
  # Repo URLs to add in the build (they are curled)
  # These are dnf .repo files, so they apply to fedora-bootc only (the
  # backend's repo_key in Immutablue's backend.yaml). arch-bootc and
  # freebsd-be define no repository key yet, and the stage is skipped there.
  # Version-specific structure: can use 'all', specific version (e.g., '42', '43'),
  # architecture suffix (e.g., 'all_aarch64'), or both (e.g., '42_aarch64')
  repo_urls:
    all:
    # - name: tailscale.repo
    #   url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    # 42:
    # - name: some-42-specific.repo
    #   url: https://example.com/fedora-42/repo
    all_aarch64:
    all_x86_64:

  # Logical packages: installed on every backend, named once.
  # An entry is either a plain name (the same on every backend) or a map:
  #   name:     the default name (and the Fedora name)
  #   rpm:      the name on fedora-bootc, when it differs from name
  #   pacman:   the name on arch-bootc
  #   freebsd:  the name on freebsd-be
  # An override can be a list (several packages for one entry) or null
  # (not available, or not wanted, on that backend).
  # The usual suffixes work: pkg_gui, pkg_silverblue, pkg_x86_64, version
  # keys, ...
  pkg:
    all:
    # - tmux
    # - {name: fd-find, pacman: fd, freebsd: null}
    # - {name: bemenu-run, pacman: [bemenu, bemenu-wayland], freebsd: bemenu}

  # Logical packages to remove, same shape as pkg
  pkg_rm:
    all:
    # - {name: nano, freebsd: null}

  # RPM packages you want to install (fedora-bootc only; and the only package
  # list read on base images built from Immutablue master)
  # Same name as anything you'd normally install with `dnf install <name>`
  rpm:
    45:
    - emacs
    # You can also add version-specific packages:
    # 42:
    # - some-package-for-42
    # 43:
    # - some-package-for-43

    # Architecture-specific RPMs
    all_aarch64:
    all_x86_64:

  # these can be set for speicific builds too (see /usr/immutablue/build_options)
  rpm_silverblue:
    all:
    - neovim

  # these can be set for speicific builds too (see /usr/immutablue/build_options)
  rpm_gui:
    all:
    - neovim-qt

  # Native packages for the other backends, in their own package names
  # (pacman -S <name> on arch-bootc, pkg install <name> on freebsd-be).
  pacman:
    all:
    # - pacman-contrib
  freebsd:
    all:
    # - linux-rl9

  # Urls to RPMs to download (they are curled)
  # so provide the url
  # (fedora-bootc; arch-bootc reads pacman_url, freebsd-be freebsd_url)
  rpm_url:
    all:
    all_aarch64:
    all_x86_64:
  # Signing keys for the rpm_url packages (fedora-bootc). Fedora 45's rpm
  # refuses a package whose key is not imported, so list each vendor's key:
  # an http(s) URL, an absolute path in the image, or a path in this repo
  # (for a key the vendor only ships inside its package).
  rpm_gpg_keys:
    all:
    # - https://example.com/RPM-GPG-KEY-example
    # - keys/RPM-GPG-KEY-example.asc
  pacman_url:
    all:
  freebsd_url:
    all:

  # RPM packages you want to remove from the image
  # (fedora-bootc; pacman_rm on arch-bootc, freebsd_rm on freebsd-be; with
  # backends, packages that are not installed are skipped, not an error)
  rpm_rm:
    all:
    - tailscale

  # You can remove
    all_aarch64:
    all_x86_64:
  pacman_rm:
    all:
  freebsd_rm:
    all:

  # Build files that need to be removed. If the build is filing about some
  # ephemeral file that exists, put the path here so it get removed in
  # the later build stages
  file_rm:
    all:
    - /etc/yum.repos.d/tailscale.repo
    # - /path/to/some/file
    # - /path/to/some/dir
  # Files can be removed per architecture as well
    all_aarch64:
    all_x86_64:


  # Repositories for Flatpaks
  flatpak_repos:
    all:
    - name: flathub
      url: https://dl.flathub.org/repo/flathub.flatpakrepo

    all_aarch64:
    all_x86_64:

  # Runtimes for Flatpaks
  # (Can query with `flatpak list --app --columns=application,runtime`)
  # Really only needed if you plan to build an iso
  flatpaks_runtime:
    all:
    # - org.gnome.Platform/x86_64/46
    # - org.freedesktop.Platform/x86_64/23.08


  # Flatpaks to be installed
  # Check https://flathub.org
  flatpaks:
    all:
    # - com.discordapp.Discord
    # - us.zoom.Zoom

  # Architecture specific
    all_aarch64:
    all_x86_64:

  # Flatpaks to be uninstalled
  flatpaks_rm:
    all:
    # - org.chromium.Chromium

  # Remove Architecture specific flatpaks
    all_aarch64:
    all_x86_64:

  # Services
  # Plain unit names work everywhere systemd does. An entry can also map the
  # unit to its rc(8) script on freebsd-be, or leave it out there with null:
  #   - {name: sshd.service, rc: sshd}
  #   - {name: foo.timer, rc: null}
  # FreeBSD has no masking and no per-user services; those requests are
  # reported and skipped there.
  # enable
  services_enable_sys:
    all:
    # - {name: sshd.service, rc: sshd}

  # xrdp requires a gui, so only do it for gui builds
  # (not-nucleus)
  # Note: Immutablue does not install xrdp on arch-bootc, so remove this
  # entry (or move it to a 45: list) before building with ARCHLINUX=1.
  services_enable_sys_gui:
    all:
    - xrdp.service
  # disable services
  services_disable_sys:
    all:
  # mask a service
  services_mask_sys:
    all:
  # unmask the service
  services_unmask_sys:
    all:

  # User services
  # Handled in immutablue installer
  # enable
  services_enable_user:
    all:
  # disable services
  services_disable_user:
    all:
  # mask a service
  services_mask_user:
    all:
  # unmask the service
  services_unmask_user:
    all:

  distrobox:
    # Give it a name, you can later enter this with
    # `distrobox enter <name>`
    all:
    - name: my-dbox
      # Which image should it be based off of?
      # See supported images with:
      #   `distrobox create --compatibility``
      image: registry.fedoraproject.org/fedora:45
      # Does this need to be ran as a root image?
      # Equal to `distrobox create --root`
      # Should be `true` or `false`
      root: false
      # Additional flags to pass to podman. You might
      # need --privileged for example for VPN software
      additional_flags:
      # - --privileged
      # You can also specify flags for certain architecture
      additional_flags_aarch64:
      additional_flags_x86_64:
      # What are the commands used to install and
      # update packages in a way that requires
      # no user input?
      # - dnf install -y
      # - apt-get install -y
      # - pacman -S --noconfirm
      # are all examples
      pkg_inst_cmd: dnf install -y
      pkg_updt_cmd: dnf update -y
      # Run any extra commands you want here...
      # - Uninstalling stuff
      # - Adding in new repos
      # - etc...
      extra_commands: |
        echo "Hi there!" && \
        cat /run/.containerenv
      # What are the packages you want to install?
      packages:
      - htop
      - fastfetch
      - nautilus
      # Architecture specific packages
      packages_aarch64:
      packages_x86_64:
      # Pakages to be install with npm
      # (installed with -g option in the container)
      npm_packages:
      # - <some_npm_package>
      npm_packages_aarch64:
      npm_packages_x86_64:
      #
      # Pakages to be install with pip
      # (installed globally in the container)
      pip_packages:
      # - <some_pip_package>
      pip_packages_aarch64:
      pip_packages_x86_64:
      #
      # Packages to install with cargo
      cargo_packages:
      # - <some_cargo_package>
      cargo_packages_aarch64:
      cargo_packages_x86_64:

      # Binaries to be exposed to the host system
      bin_export:
      - htop
      - nautilus
      bin_export_aarch64:
      bin_export_x86_64:

      # Apps to be exposed to the host system
      app_export:
      - nautilus
      app_export_aarch64:
      app_export_x86_64:

      # Binaries to be symlinked "into" the container
      # from the underlying host. Great for container
      # runtime things, tools already on the host,
      # things requiring ptrace, etc.
      bin_symlink:
      - podman
      bin_symlink_aarch:
      bin_symlink_x86_64:

    # Extend onto an upstream distrobox
    # This is already provided out-of-the-box
    # by Immutablue
    - name: util
      # Leave image as empty if its changing
      # how an existing container created in
      # an upstream image
      image:
      # Still need to have the pkg commands
      pkg_inst_cmd: dnf install -y
      pkg_updt_cmd: dnf update -y
      # Do whatever you want in extra commands
      extra_commands:
      # Add extra packages on top of
      packages:
      - gcc-gfortran
      # Just tweak the stuff below if you want
      # to add to anything. And note that we
      # do not need to put the architecture
      # specific sections.
      npm_packages:
      pip_packages:
      cargo_packages:
      bin_export:
      app_export:
      bin_symlink:

  # Brew packages to install or uninstall.
  brew:
    # Packages to install
    install:
      all:
    # Packages to uninstall from upstream images
    uninstall:
      all:



